<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="pick.css" />
    <title>Open this link…</title>
  </head>
  <body>
    <main>
      <!-- Both of these are rewritten for Chromium in pick.js: they name a
           choice of container, and Chromium has none. -->
      <h1 id="title">Where should this open?</h1>
      <!-- The URL is shown in full and never made clickable: this page is
           web_accessible, so any site can link to it with a URL of its
           choosing, and a link here would be a one-click open of whatever a
           stranger put in the query string. -->
      <p id="url" class="url"></p>

      <!-- Why this page appeared at all. The whole detection is a process of
           exclusion, so when it gets one wrong there has to be something to
           point at. -->
      <p id="why" class="note" hidden></p>

      <ul id="choices" class="choices" aria-label="Containers"></ul>

      <!-- Three equal columns, so the row lines up with the container list
           above it instead of being three different widths. That only works
           with labels short enough not to wrap: what each one does beyond its
           label is on the line underneath, once, rather than inside a button. -->
      <div class="row">
        <button id="plain" type="button">No container</button>
        <button id="copy" type="button">Copy link</button>
        <button id="cancel" type="button" class="quiet">Close tab</button>
      </div>
      <p class="note row-note">Copying opens nothing.</p>

      <label id="remember-row" class="check" hidden>
        <input id="remember" type="checkbox" />
        Remember this for <span id="host" class="host"></span>
      </label>

      <p id="note" class="note" hidden></p>
      <output id="status" class="status" hidden></output>
    </main>
    <script type="module" src="pick.js"></script>
  </body>
</html>
